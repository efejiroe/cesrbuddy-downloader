<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CESR Buddy Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      padding: 16px;
      background: #fff;
      color: #1a1a2e;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      width: 34px;
      height: 34px;
      background: #d63384;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo svg { fill: #fff; }

    header h1 {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }
    header p {
      font-size: 11px;
      color: #6c757d;
      line-height: 1.4;
      margin-top: 2px;
    }

    /* ── button row ── */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn {
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* PNG — filled pink */
    #btn-png {
      background: #d63384;
      color: #fff;
    }
    #btn-png:hover:not(:disabled) { background: #b02a6c; }

    /* PDF — outlined */
    #btn-pdf {
      background: #fff;
      color: #d63384;
      border: 2px solid #d63384;
    }
    #btn-pdf:hover:not(:disabled) { background: #fdf0f6; }

    .btn svg { flex-shrink: 0; }

    /* ── divider ── */
    .divider {
      font-size: 10px;
      color: #adb5bd;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── status ── */
    #status {
      font-size: 12px;
      line-height: 1.5;
      min-height: 32px;
      text-align: center;
      white-space: pre-wrap;
      word-break: break-word;
      color: #495057;
    }
    #status.error   { color: #dc3545; }
    #status.success { color: #198754; }

    /* ── badge showing which format succeeded ── */
    .format-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 4px;
      vertical-align: middle;
      background: #d63384;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
        <path d="M12 16l-6-6h4V4h4v6h4l-6 6zm-7 2h14v2H5v-2z"/>
      </svg>
    </div>
    <div>
      <h1>CESR Buddy Downloader</h1>
      <p>Save this assessment page with LO codes in the filename.</p>
    </div>
  </header>

  <div class="btn-row">
    <!-- PNG button -->
    <button id="btn-png" class="btn" title="Full-page pixel-perfect image">
      <!-- image icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>
      </svg>
      Download PNG
    </button>

    <!-- PDF button -->
    <button id="btn-pdf" class="btn" title="Searchable PDF — text is real, not an image">
      <!-- document icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/>
      </svg>
      Searchable PDF
    </button>
  </div>

  <div class="divider">Text is selectable &amp; searchable in the PDF</div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
